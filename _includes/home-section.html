<script>
  document.addEventListener('DOMContentLoaded', function () {
    const video = document.getElementById('heroVideo');
    const videoControlBtn = document.getElementById('videoControlBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');

    if (!video || !videoControlBtn || !playIcon || !pauseIcon) return;

    // Synchronize icons based on actual video state
    const syncIcons = () => {
      playIcon.classList.toggle('hidden', !video.paused);
      pauseIcon.classList.toggle('hidden', video.paused);
    };

    video.addEventListener('playing', syncIcons);
    video.addEventListener('pause', syncIcons);

    videoControlBtn.addEventListener('click', function () {
      if (video.paused) {
        video.play().catch(err => console.warn("Video play failed:", err));
      } else {
        video.pause();
      }
    });

    // Robust autoplay trigger
    video.play().catch(() => syncIcons());

    // GSAP Hero Animation
    if (typeof gsap !== 'undefined') {
      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
      
      // 1. Text Stagger Reveal
      tl.from(".hero-anim", {
        y: 40,
        opacity: 0,
        duration: 0.8,
        stagger: 0.15,
        delay: 0.1 // Short delay for initial render
      });
      
      // 2. Video Cinematic Entrance
      tl.from(".hero-video-anim", {
        scale: 0.95,
        opacity: 0,
        duration: 1.2,
        clearProps: "transform" // Let CSS take over for 3D perspective and hover
      }, "-=0.8"); // Overlap with text animation
      
      // 3. Clients Strip
      tl.from(".hero-clients-anim", {
        y: 20,
        opacity: 0,
        duration: 0.8,
      }, "-=0.4");
    }
  });
</script>
