<header id="site-header" class="py-4 px-6 md:px-12 fixed w-full z-50 top-0 transition-transform duration-300 ease-in-out">
  <div class="flex items-center justify-between w-full">
    <nav class="flex items-center justify-between w-full md:pl-0">
      <!-- Left: Logo -->
      <div class="flex items-center">
        <a href="/#home" class="flex items-center">
          <img src="/assets/images/logo.png" alt="Mạnh Huỳnh Logo" class="h-20 md:h-10 w-auto" />
        </a>
      </div>
      
      <!-- Right: Navigation links + Theme toggle -->
      <div class="flex items-center ml-auto">
        <ul class="hidden md:flex space-x-8 mr-8">
          <li><a href="/#home" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_home">Trang Chủ</a></li>
          <li><a href="/about" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_about">Giới Thiệu</a></li>
          <li><a href="/#portfolio" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_portfolio">Dự Án</a></li>
          <li><a href="/#services" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_services">Dịch Vụ</a></li>
          <li><a href="/#contact" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_contact">Liên Hệ</a></li>
          <li><a href="/blog" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_blog">Blog</a></li>
          <li><a href="https://manhdesigns.gumroad.com" target="_blank" rel="noopener noreferrer" class="text-main hover:text-accent-strong transition duration-300 text-lg font-medium" data-lang-key="nav_download">Download</a></li>
        </ul>
        
        <div class="flex flex-col sm:flex-row items-center space-y-2 sm:space-y-0">
          <label class="switch" id="theme-toggle-label">
            <input type="checkbox" id="theme-toggle-checkbox" title="Toggle theme">
            <span class="slider round"></span>
            <script>
              if (localStorage.getItem('theme') === 'light') {
                document.currentScript.parentNode.querySelector('input').checked = true;
              }
            </script>
          </label>
        </div>
      </div>
    </nav>
  </div>
 
</header>
