# FAQ
faq_section_title: "Frequently Asked Questions (FAQ)"
faq_motion_q1: "What types of products are best suited for 3D Motion Design?"
faq_motion_a1: 'Almost any physical product is suitable. This service is highly optimized for:<br>• <strong>Cosmetics:</strong> Showcasing smooth textures, serum flows, or luxury close-up angles.<br>• <strong>Tech gadgets & Appliances:</strong> Explaining intricate parts and rotating joints.<br>• <strong>Consumer packaging:</strong> Highlighting unique box designs and opening mechanisms.<br>• <strong>Internal mechanisms:</strong> Like spray nozzles or inner layers that are difficult to capture with traditional filming.'
faq_motion_q2: "What assets do I need to provide to start a project?"
faq_motion_a2: 'To start a project, you can provide:<br>• <strong>Ideal setup:</strong> Original 3D CAD design files from the manufacturer (formats like STEP, IGES, OBJ, FBX...).<br>• <strong>Standard setup:</strong> High-quality photos of the physical product from various angles (front, back, sides) along with actual dimensions.<br>• <strong>Additional assets:</strong> Vector brand logos (AI, SVG, PDF formats) and Brand Guidelines if available.'
faq_motion_q3: "How does the revision and delivery process work?"
faq_motion_a3: 'The project is implemented through clear approval milestones:<br>1. <strong>Storyboard Approval:</strong> Shaping the storyline and camera angles.<br>2. <strong>Styleframe Approval:</strong> Defining colors, lighting, and product materials.<br>3. <strong>Animatic Approval:</strong> Checking motion rhythm, timing, and pacing.<br>4. <strong>Final Render & Post-production:</strong> Exporting high-quality video and finalizing audio.<br><br>At each approval milestone, you will have up to <strong>3 rounds of free revisions</strong> to ensure the final output matches your vision.'
faq_motion_q4: "How is a 3D product video different from regular product filming?"
faq_motion_a4: 'Compared to traditional filming, 3D video offers distinct advantages:<br>• <strong>Creative freedom:</strong> Showcasing surreal angles like 360-degree rotations and cross-section reveals of internal mechanisms.<br>• <strong>Absolute control:</strong> Perfecting lighting, colors, and materials without physical environment limitations.<br>• <strong>Simplified preparation:</strong> No studio setup or physical sample is required. Production can start with just reference images or blueprints.'
faq_motion_q5: "Can I start a project if I do not have any existing design files?"
faq_motion_a5: '<strong>Absolutely.</strong> You only need to provide:<br>• Product photos from multiple angles (front, back, sides).<br>• Your brand logo (vector format) and brand color palette.<br><br>The 3D model will be custom-built from scratch using these reference materials. The clearer and more detailed your references, the higher the accuracy and resemblance to the original product.'
faq_cgi_q1: "What is Social CGI (FOOH) and why is it trending?"
faq_cgi_a1: 'FOOH (Fake Out of Home) is a video format that combines real-world footage with 3D CGI to create surreal spectacles (such as giant handbags rolling down a street).<br><br>Why this format is trending in modern marketing:<br>• <strong>High curiosity:</strong> The blurred line between reality and CGI stops users from scrolling and sparks discussion.<br>• <strong>Massive engagement:</strong> Drives organic shares and comments, allowing campaigns to go viral on platforms like TikTok, Reels, and Shorts.'
faq_cgi_q2: "How should I prepare the background video footage?"
faq_cgi_a2: 'You can prepare the background footage in two ways:<br>• <strong>Self-shooting:</strong> Capture the location using a high-quality smartphone. The key requirements are stable, smooth camera movements (using a gimbal is highly recommended), avoiding shaky motion, and ensuring ample lighting.<br>• <strong>Supported production:</strong> I will consult on the storyboard and assist in sourcing high-quality stock footage or provide detailed guidelines to help you capture the perfect scene.'
faq_cgi_q3: "What factors affect how realistic a CGI video looks?"
faq_cgi_a3: 'The realism of a CGI video is determined by:<br>• <strong>Quality of the source footage:</strong> Natural lighting direction, sharpness, and camera stability.<br>• <strong>Post-production precision:</strong> 3D camera tracking, matching light sources, cast shadows, and reflections to the real environment, completed with unified color grading.<br><br>To ensure the best outcome, location and shooting conditions are analyzed carefully at the start. You can check the portfolio to evaluate the level of polish on past projects.'
faq_cgi_q4: "What does the cost of a CGI video typically include?"
faq_cgi_a4: 'The production cost for a complete CGI video includes:<br>• Creative script and storyboard consultation.<br>• 3D product or object modeling according to specifications.<br>• VFX compositing (3D tracking, matchmoving, light & shadow matching).<br>• Color grading and exporting optimized files for social media.<br><br>Starting rate is from <strong>21,500,000 VND</strong> per project. Please get in touch for a detailed quote tailored to your specific script concept.'
faq_cgi_q5: "How is CGI FOOH different from AI-generated videos?"
faq_cgi_a5: 'These two technologies serve different marketing needs:<br>• <strong>CGI FOOH (Crafted 3D + VFX):</strong> Composites precise 3D assets into real footage. This offers absolute control over product shape, brand colors, and exact layout specifications.<br>• <strong>Generative AI Video:</strong> Creates video entirely from prompts. While faster, it has significant limitations in maintaining brand identity accuracy and exact product details.<br><br>In CGI FOOH production, AI tools are applied selectively to optimize production time and costs for secondary steps (such as rapid background separation, texture upscaling, or resolution enhancement).'
faq_webar_q1: "What is WebAR (Web-based Augmented Reality)?"
faq_webar_a1: 'WebAR is an Augmented Reality technology that runs directly inside default mobile web browsers (such as Safari on iOS, Chrome on Android).<br><br>Users only need to scan a QR code or tap a URL link to experience AR instantly, without having to download or install any external applications.'
faq_webar_q2: "How can WebAR be used in e-commerce and marketing?"
faq_webar_a2: 'WebAR provides interactive features that boost engagement and sales conversions:<br>• <strong>Virtual Try-on:</strong> Place furniture in a real room, or try on eyewear, watches, and makeup before purchasing.<br>• <strong>Interactive 3D Product Pages:</strong> Embed 360-degree rotating 3D models directly on e-commerce sites for detailed inspection.<br>• <strong>Interactive Packaging:</strong> Customers scan package labels in-store to open mini-games or 3D animations explaining product benefits.'
faq_webar_q3: "Do my customers need to install an app or create an account to use it?"
faq_webar_a3: '<strong>No app installation or account registration is required.</strong><br><br>Users simply scan a QR code using their camera or tap a link. The AR experience launches instantly on Safari (iOS) or Chrome (Android), minimizing interaction friction and maximizing campaign participation rates.'
faq_webar_q4: "What types of interactive experiences are available?"
faq_webar_a4: 'WebAR experiences are delivered in four main formats:<br>• <strong>Pure AR:</strong> Displaying 3D models in real space or providing virtual try-on options.<br>• <strong>Gamification:</strong> Web-based interactive mini-games, optimized for online brand activation campaigns.<br>• <strong>Gamification + AR:</strong> Mini-games integrated with augmented reality elements to boost interactivity.<br>• <strong>AI Photobooth:</strong> Interactive photo-taking with AI effects, ideal for attracting traffic at physical event booths.'
faq_webar_q5: "How are campaign costs and duration calculated?"
faq_webar_a5: 'Project pricing is structured into two parts:<br>• <strong>Production Fee (One-time):</strong> Includes UI design, web-optimized 3D asset creation, and interactive coding.<br>• <strong>Operational & Hosting Fee (By campaign duration):</strong> Covers hosting server maintenance, database storage, and traffic bandwidth.<br><br><strong>Optional features:</strong> Upon request, a lead generation form (collecting names, emails, phone numbers) can be integrated. At the end of the campaign, you will receive an Excel data export along with detailed traffic and gameplay statistics.'
